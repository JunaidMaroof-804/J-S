<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>معاف کر دیں، جان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:        #2a0f1c;   /* deep maroon-wine */
    --bg-deep-2:      #1b1330;   /* deep navy-plum */
    --rose-gold:      #e8b4a0;
    --rose-gold-soft: #f3d6c8;
    --pink-soft:      #f7a8c4;
    --pink-glow:      #ff8fb3;
    --cream:          #fff6f0;
    --gold-line:      #d8a86f;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, #3c1530 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, #1d1238 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    background-attachment: fixed;
    color: var(--cream);
    font-family: 'Marcellus', serif;
  }

  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- Layered ambient background ---------- */
  .bg-hearts{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .bg-heart{
    position:absolute;
    bottom:-10%;
    color: var(--pink-soft);
    opacity:.35;
    filter: drop-shadow(0 0 6px rgba(255,143,179,.55));
    animation: floatUp linear infinite, pulseSoft 3.2s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%   { opacity:.45; }
    50%  { transform: translateY(-55vh) translateX(var(--drift,20px)) rotate(15deg); }
    92%  { opacity:.35; }
    100% { transform: translateY(-115vh) translateX(calc(var(--drift,20px) * -1)) rotate(-10deg); opacity:0; }
  }
  @keyframes pulseSoft{
    0%,100%{ transform-origin:center; filter: drop-shadow(0 0 4px rgba(255,143,179,.4)) brightness(1); }
    50%{ filter: drop-shadow(0 0 12px rgba(255,143,179,.8)) brightness(1.25); }
  }

  /* ---------- Entry cascade (confetti + glowing hearts) ---------- */
  .cascade-layer{
    position:fixed; inset:0; z-index:50; overflow:hidden; pointer-events:none;
  }
  .fall-piece{
    position:absolute;
    top:-12%;
    animation-name: fallDown;
    animation-timing-function: cubic-bezier(.35,0,.65,1);
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes fallDown{
    0%   { transform: translateY(0) rotate(0deg); opacity:1; }
    100% { transform: translateY(112vh) rotate(540deg); opacity:.15; }
  }
  .confetti-bit{
    width:8px; height:14px; border-radius:2px;
  }
  .heart-bit{
    font-size: 18px;
    filter: drop-shadow(0 0 8px rgba(255,143,179,.9));
  }

  /* ---------- Main content ---------- */
  .stage{
    position:relative; z-index:5;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 7vh 5vw 8vh;
    gap: clamp(18px, 4vw, 34px);
  }

  .ornament-line{
    display:flex; align-items:center; gap:14px;
    color: var(--gold-line);
    opacity:.8;
  }
  .ornament-line::before, .ornament-line::after{
    content:"";
    width: clamp(30px, 8vw, 70px);
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
  }
  .ornament-line span{ font-size: 13px; letter-spacing: .35em; text-transform:uppercase; }

  .headline-ur{
    font-family: 'Noto Nastaliq Urdu', serif;
    font-weight: 700;
    font-size: clamp(2rem, 6.5vw, 3.6rem);
    line-height: 1.9;
    color: var(--rose-gold-soft);
    text-shadow: 0 0 24px rgba(232,180,160,.45), 0 0 2px rgba(255,255,255,.3);
    max-width: 18ch;
    direction: rtl;
    animation: gentleGlow 4s ease-in-out infinite;
  }
  @keyframes gentleGlow{
    0%,100%{ text-shadow: 0 0 24px rgba(232,180,160,.45), 0 0 2px rgba(255,255,255,.3); }
    50%{ text-shadow: 0 0 38px rgba(255,143,179,.7), 0 0 6px rgba(255,255,255,.5); }
  }

  .subhead-en{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 2.6vw, 1.45rem);
    color: var(--cream);
    opacity:.88;
    max-width: 36ch;
    letter-spacing:.01em;
  }

  /* ---------- Central animated heart ---------- */
  .heart-wrap{
    position:relative;
    width: clamp(120px, 22vw, 190px);
    height: clamp(120px, 22vw, 190px);
    display:flex; align-items:center; justify-content:center;
    margin: 6px 0;
  }
  .heart-ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid rgba(232,180,160,.35);
    animation: ringPulse 2.6s ease-out infinite;
  }
  .heart-ring.delay{ animation-delay: 1.3s; }
  @keyframes ringPulse{
    0%{ transform:scale(.55); opacity:.8; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  .big-heart{
    width: 62%; height: 62%;
    color: var(--pink-glow);
    filter: drop-shadow(0 0 18px rgba(255,143,179,.85)) drop-shadow(0 0 40px rgba(255,143,179,.4));
    animation: beat 1.15s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes beat{
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(0.94); }
    45%      { transform: scale(1.12); }
    60%      { transform: scale(1); }
  }

  /* ---------- Buttons ---------- */
  .btn-row{
    position:relative;
    display:flex; flex-wrap:wrap; gap: 20px;
    align-items:center; justify-content:center;
    width:100%;
    margin-top: 8px;
    min-height: 140px; /* room for the runaway button to roam without collapsing layout */
  }
  .btn{
    font-family:'Noto Nastaliq Urdu', serif;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    padding: 14px 34px;
    border-radius: 50px;
    border: 1px solid transparent;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:active{ transform: scale(.96); }

  .btn-forgive{
    background: linear-gradient(135deg, #f7c6a3, #f0a6b8);
    color: #3a1322;
    font-weight:700;
    box-shadow: 0 0 18px rgba(247,168,196,.55), 0 4px 18px rgba(0,0,0,.35);
    animation: glowPulse 2.4s ease-in-out infinite;
  }
  .btn-forgive:hover{ transform: translateY(-3px) scale(1.03); }
  @keyframes glowPulse{
    0%,100%{ box-shadow: 0 0 16px rgba(247,168,196,.5), 0 4px 18px rgba(0,0,0,.35); }
    50%{ box-shadow: 0 0 32px rgba(247,168,196,.9), 0 4px 22px rgba(0,0,0,.4); }
  }

  .btn-angry{
    background: rgba(255,255,255,.06);
    color: var(--cream);
    border-color: rgba(255,255,255,.25);
    backdrop-filter: blur(2px);
  }
  /* When set loose to roam the screen */
  .btn-angry.roaming{
    position: fixed;
    z-index: 60;
    transition: top .28s cubic-bezier(.34,1.56,.64,1), left .28s cubic-bezier(.34,1.56,.64,1), transform .18s ease;
  }

  .hint{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: .95rem;
    color: var(--rose-gold-soft);
    opacity:.65;
    margin-top: -6px;
  }

  /* ---------- Result message ---------- */
  .result-msg{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    color: var(--rose-gold-soft);
    max-width: 32ch;
    opacity:0;
    transform: translateY(14px);
    transition: opacity .7s ease, transform .7s ease;
    text-shadow: 0 0 18px rgba(232,180,160,.4);
  }
  .result-msg.show{ opacity:1; transform:none; }

  /* ---------- Fireworks layer ---------- */
  .fireworks-layer{
    position:fixed; inset:0; z-index:55; pointer-events:none; overflow:hidden;
  }
  .fw-heart{
    position:absolute;
    font-size: 14px;
    color: var(--pink-glow);
    opacity:0;
    filter: drop-shadow(0 0 8px rgba(255,143,179,.9));
    animation: fwBurst 1.2s ease-out forwards;
  }
  @keyframes fwBurst{
    0%   { opacity:1; transform: translate(0,0) scale(.4); }
    70%  { opacity:1; }
    100% { opacity:0; transform: translate(var(--tx), var(--ty)) scale(1.1); }
  }

  footer.credit{
    position:relative; z-index:5;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-size:.8rem;
    color: rgba(255,246,240,.4);
    padding-bottom: 22px;
    letter-spacing:.05em;
  }

  @media (max-width: 480px){
    .btn{ padding: 12px 26px; }
    .btn-row{ gap:16px; }
  }
</style>
</head>
<body>

  <!-- Ambient floating background hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <!-- Entry cascade layer (confetti + glowing hearts) -->
  <div class="cascade-layer" id="cascadeLayer"></div>

  <!-- Fireworks layer (triggered on forgive) -->
  <div class="fireworks-layer" id="fireworksLayer"></div>

  <main class="stage">
    <div class="ornament-line"><span>For My Love</span></div>

    <h1 class="headline-ur">معاف کر دیں، جان! ناراضگی چھوڑ دیں۔</h1>
    <p class="subhead-en">I am truly sorry. I miss your smile. Please give me another chance.</p>

    <div class="heart-wrap">
      <div class="heart-ring"></div>
      <div class="heart-ring delay"></div>
      <svg class="big-heart" viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M16 28.5s-13-8.2-15-16.6C-0.3 5.9 4.1 1 9.4 1c3 0 5.4 1.6 6.6 4 1.2-2.4 3.6-4 6.6-4C27.9 1 32.3 5.9 31 11.9 29 20.3 16 28.5 16 28.5z"/>
      </svg>
    </div>

    <div class="btn-row" id="btnRow">
      <button class="btn btn-forgive" id="forgiveBtn">معاف کیا</button>
      <button class="btn btn-angry" id="angryBtn">ابھی بھی غصہ ہوں</button>
    </div>

    <p class="hint" id="hint">— go on, try to catch that button —</p>

    <p class="result-msg" id="resultMsg">Thank you, my love! You made my day. I love you forever. 💗</p>
  </main>

  <footer class="credit">made with a sorry heart, just for you</footer>

<script>
(() => {
  'use strict';

  /* =========================================================
     1. Ambient background hearts (infinite, slow, pulsating)
     ========================================================= */
  const bgLayer = document.getElementById('bgHearts');
  const HEART_GLYPH = '❤';
  const BG_HEART_COUNT = window.innerWidth < 600 ? 16 : 28;

  function spawnBgHeart() {
    const el = document.createElement('span');
    el.className = 'bg-heart';
    el.textContent = HEART_GLYPH;
    const size = 10 + Math.random() * 22;
    const left = Math.random() * 100;
    const duration = 9 + Math.random() * 10;
    const delay = Math.random() * 12;
    const drift = (Math.random() * 60 - 30) + 'px';
    el.style.left = left + 'vw';
    el.style.fontSize = size + 'px';
    el.style.setProperty('--drift', drift);
    el.style.animationDuration = `${duration}s, ${2.4 + Math.random() * 1.6}s`;
    el.style.animationDelay = `${delay}s, ${Math.random() * 2}s`;
    bgLayer.appendChild(el);
  }
  for (let i = 0; i < BG_HEART_COUNT; i++) spawnBgHeart();

  /* =========================================================
     2. Entry cascade: confetti + glowing hearts for ~3 seconds
     ========================================================= */
  const cascadeLayer = document.getElementById('cascadeLayer');
  const CONFETTI_COLORS = ['#f7a8c4', '#e8b4a0', '#d8a86f', '#fff6f0', '#ff8fb3'];

  function spawnFallPiece(isHeart) {
    const el = document.createElement('div');
    const left = Math.random() * 100;
    const duration = 2.4 + Math.random() * 1.4;
    const delay = Math.random() * 1.2;

    el.className = 'fall-piece ' + (isHeart ? 'heart-bit' : 'confetti-bit');
    el.style.left = left + 'vw';
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';

    if (isHeart) {
      el.textContent = HEART_GLYPH;
      el.style.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    } else {
      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      el.style.transform = `rotate(${Math.random() * 360}deg)`;
    }

    cascadeLayer.appendChild(el);
    // Clean up after animation completes
    setTimeout(() => el.remove(), (duration + delay) * 1000 + 200);
  }

  function runEntryCascade() {
    const total = 60;
    for (let i = 0; i < total; i++) {
      const isHeart = i % 3 === 0;
      spawnFallPiece(isHeart);
    }
  }
  runEntryCascade();
  // Remove the cascade layer's pointer-blocking presence after it's done (already pointer-events:none, but tidy DOM)
  setTimeout(() => { cascadeLayer.innerHTML = ''; }, 4200);

  /* =========================================================
     3. Forgive button -> fireworks of hearts + message
     ========================================================= */
  const forgiveBtn = document.getElementById('forgiveBtn');
  const resultMsg = document.getElementById('resultMsg');
  const fireworksLayer = document.getElementById('fireworksLayer');
  const angryBtn = document.getElementById('angryBtn');
  const hint = document.getElementById('hint');

  function burstAt(x, y) {
    const count = 18;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'fw-heart';
      piece.textContent = HEART_GLYPH;
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const distance = 80 + Math.random() * 140;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      piece.style.left = x + 'px';
      piece.style.top = y + 'px';
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.fontSize = (12 + Math.random() * 16) + 'px';
      piece.style.animationDelay = (Math.random() * 0.15) + 's';
      fireworksLayer.appendChild(piece);
      setTimeout(() => piece.remove(), 1600);
    }
  }

  function fullScreenFireworks() {
    const bursts = 7;
    for (let i = 0; i < bursts; i++) {
      setTimeout(() => {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight * 0.7 + window.innerHeight * 0.05;
        burstAt(x, y);
      }, i * 280);
    }
  }

  let forgiven = false;
  forgiveBtn.addEventListener('click', () => {
    if (forgiven) return;
    forgiven = true;

    fullScreenFireworks();
    resultMsg.classList.add('show');

    // Retire the "still angry" button gracefully once forgiven
    angryBtn.style.transition = 'opacity .5s ease, transform .5s ease';
    angryBtn.style.opacity = '0';
    angryBtn.style.transform = 'scale(.8)';
    setTimeout(() => { angryBtn.style.display = 'none'; }, 500);
    hint.style.transition = 'opacity .5s ease';
    hint.style.opacity = '0';

    // Gentle continued sparkle for a few seconds
    let waves = 0;
    const sparkleInterval = setInterval(() => {
      waves++;
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight * 0.6 + window.innerHeight * 0.1;
      burstAt(x, y);
      if (waves >= 4) clearInterval(sparkleInterval);
    }, 900);
  });

  /* =========================================================
     4. "Still Angry" button: runs away from cursor / tap
     ========================================================= */
  const btnRow = document.getElementById('btnRow');

  function makeRoaming() {
    if (!angryBtn.classList.contains('roaming')) {
      const rect = angryBtn.getBoundingClientRect();
      angryBtn.style.top = rect.top + 'px';
      angryBtn.style.left = rect.left + 'px';
      angryBtn.classList.add('roaming');
    }
  }

  function jumpAway() {
    if (forgiven) return;
    makeRoaming();

    const btnW = angryBtn.offsetWidth || 180;
    const btnH = angryBtn.offsetHeight || 54;
    const margin = 16;

    const maxX = Math.max(margin, window.innerWidth - btnW - margin);
    const maxY = Math.max(margin, window.innerHeight - btnH - margin);

    const newX = margin + Math.random() * (maxX - margin);
    const newY = margin + Math.random() * (maxY - margin);

    angryBtn.style.left = newX + 'px';
    angryBtn.style.top = newY + 'px';

    // tiny playful wobble
    angryBtn.style.transform = `rotate(${(Math.random() * 16 - 8).toFixed(1)}deg)`;
    setTimeout(() => { angryBtn.style.transform = 'rotate(0deg)'; }, 250);
  }

  // Desktop: evade on hover (mouseenter fires before a click can land)
  angryBtn.addEventListener('mouseenter', jumpAway);
  angryBtn.addEventListener('pointerenter', (e) => {
    if (e.pointerType === 'touch') return; // handled separately below for mobile
    jumpAway();
  });

  // Mobile: evade on the very first touch contact, before a tap registers as a click
  angryBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    jumpAway();
  }, { passive: false });

  // Safety net: if it's ever somehow clicked, just make it jump again
  angryBtn.addEventListener('click', (e) => {
    e.preventDefault();
    jumpAway();
  });

  // Keep the roaming button within bounds on resize
  window.addEventListener('resize', () => {
    if (angryBtn.classList.contains('roaming')) {
      const rect = angryBtn.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - 16;
      const maxY = window.innerHeight - rect.height - 16;
      angryBtn.style.left = Math.min(rect.left, Math.max(16, maxX)) + 'px';
      angryBtn.style.top = Math.min(rect.top, Math.max(16, maxY)) + 'px';
    }
  });

})();
</script>
</body>
</html>
